  <rect width="900" height="384" rx="18" fill="#f7f4ee"/>
  <rect x="16" y="16" width="868" height="352" rx="14" fill="#ffffff" stroke="#e3ddd2"/>
  <circle cx="40" cy="40" r="5" fill="#ff5f57"/><circle cx="58" cy="40" r="5" fill="#febc2e"/><circle cx="76" cy="40" r="5" fill="#28c840"/>
  <text x="96" y="44" class="title">同一个请求，两种回答</text>
  <rect x="36" y="128" width="404" height="214" rx="12" fill="#f3f1ed" stroke="#e3ddd2"/>
  <rect x="460" y="128" width="404" height="214" rx="12" fill="#fbf8f2" stroke="#c46f1f" stroke-opacity=".55"/>
  <circle cx="62" cy="152" r="5" fill="#7d858f"/><text x="76" y="156" class="lbl">普通 AI</text>
  <circle cx="486" cy="152" r="5" fill="#c46f1f"/><text x="500" y="156" class="lbl">加载技能后</text>
  <text x="860" y="362" text-anchor="end" class="title">1,250 个技能 · 每个都是一份 Markdown 文件</text>
  <g class="b0">
    <rect x="40" y="72" width="448.1999999999999" height="40" rx="13" fill="#e3eef8"/>
    <clipPath id="c0"><rect class="ty0" x="50" y="76" width="0" height="32"/></clipPath>
    <text x="56" y="97" class="ask" clip-path="url(#c0)">公司要和我协商解除，工作 6 年 7 个月，月薪 2.5 万。</text>
  </g>
  <text x="58" y="196" class="g0_0 gen">补偿金额取决于多种因素。</text>
  <text x="58" y="226" class="g0_1 gen">建议咨询专业律师。</text>
  <text x="58" y="256" class="g0_2 gen">请参考当地相关规定。</text>
  <g class="k0"><rect x="636.3" y="139" width="211.70000000000002" height="26" rx="13" fill="#efe6fb"/><text x="649.3" y="157" class="chip">⚡ cn-severance-calculator</text></g>
  <text x="482" y="196" class="s0_0 out">适用情形：协商解除，按 N 计算（第 36、46 条）</text>
  <text x="482" y="226" class="s0_1 out">年限：6 年 7 个月，满半年按 1 年，计 7 个月</text>
  <text x="482" y="256" class="s0_2 out">估算：2.5 万 × 7 = 17.5 万元（核对三倍封顶）</text>
  <text x="482" y="286" class="s0_3 out">✅ 另算：未休年假工资、已挣年终奖</text>
  <g class="v0"><text x="58" y="324" class="vb">✗ 看完还是不知道怎么做</text><text x="482" y="324" class="vg">✓ 拿来就能用</text></g>
  <g class="b1">
    <rect x="40" y="72" width="359.79999999999995" height="40" rx="13" fill="#e3eef8"/>
    <clipPath id="c1"><rect class="ty1" x="50" y="76" width="0" height="32"/></clipPath>
    <text x="56" y="97" class="ask" clip-path="url(#c1)">这道申论题怎么答？归纳概括，200 字以内。</text>
  </g>
  <text x="58" y="196" class="g1_0 gen">申论需要多读多练。</text>
  <text x="58" y="226" class="g1_1 gen">答题要条理清晰。</text>
  <text x="58" y="256" class="g1_2 gen">注意字数要求。</text>
  <g class="k1"><rect x="667.9" y="139" width="180.1" height="26" rx="13" fill="#efe6fb"/><text x="680.9" y="157" class="chip">⚡ cn-civil-exam-essay</text></g>
  <text x="482" y="196" class="s1_0 out">题型：归纳概括，考查要点提取与归纳</text>
  <text x="482" y="226" class="s1_1 out">要点 1–5：逐段提取，标注来源段落</text>
  <text x="482" y="256" class="s1_2 out">参考答案：196 字 / 限 200 字</text>
  <text x="482" y="286" class="s1_3 out">✅ 批改：漏 1 个要点，大致二类文</text>
  <g class="v1"><text x="58" y="324" class="vb">✗ 看完还是不知道怎么做</text><text x="482" y="324" class="vg">✓ 拿来就能用</text></g>
  <g class="b2">
    <rect x="40" y="72" width="249.5" height="40" rx="13" fill="#e3eef8"/>
    <clipPath id="c2"><rect class="ty2" x="50" y="76" width="0" height="32"/></clipPath>
    <text x="56" y="97" class="ask" clip-path="url(#c2)">帮我把这些笔记整理成周报。</text>
  </g>
  <text x="58" y="196" class="g2_0 gen">本周各项工作顺利推进中。</text>
  <text x="58" y="226" class="g2_1 gen">相关任务持续跟进。</text>
  <text x="58" y="256" class="g2_2 gen">下周继续努力。</text>
  <g class="k2"><rect x="691.6" y="139" width="156.4" height="26" rx="13" fill="#efe6fb"/><text x="704.6" y="157" class="chip">⚡ cn-weekly-report</text></g>
  <text x="482" y="196" class="s2_0 out">一、本周完成：支付页改版上线，转化率 3.1% → 3.6%</text>
  <text x="482" y="226" class="s2_1 out">三、风险：埋点未就绪，A/B 测试可能延期</text>
  <text x="482" y="256" class="s2_2 out">四、下周计划：埋点上线｜李明｜10 月 9 日</text>
  <text x="482" y="286" class="s2_3 out">✅ 一句话版本已生成，可以直接发群</text>
  <g class="v2"><text x="58" y="324" class="vb">✗ 看完还是不知道怎么做</text><text x="482" y="324" class="vg">✓ 拿来就能用</text></g>
