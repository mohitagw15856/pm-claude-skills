<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="Ways to contribute, from reporting a bug to maintaining a bundle, with how many people have done each"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="860" height="350" rx="14" fill="#ffffff"/><text x="24" y="38" font-size="20" font-weight="800" fill="#1f2328">Levels of contribution</text><text x="24" y="56" font-size="13" fill="#57606a">6 contributors so far. Every level is credited in the table below the wall.</text><g transform="translate(24 70)"><rect width="812" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="27" font-size="18">🐛</text><text x="52" y="20" font-size="15" font-weight="700" fill="#1f2328">1. Report or fix a bug</text><text x="52" y="35" font-size="12.5" fill="#57606a">Open an issue or a pull request</text><text x="788" y="27" text-anchor="end" font-size="13" fill="#c46f1f" font-weight="700">1 person</text></g><g transform="translate(24 120)"><rect width="812" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="27" font-size="18">🌍</text><text x="52" y="20" font-size="15" font-weight="700" fill="#1f2328">2. Translate a skill</text><text x="52" y="35" font-size="12.5" fill="#57606a">Claim one on the translation board</text><text x="788" y="27" text-anchor="end" font-size="13" fill="#c46f1f" font-weight="700">1 person</text></g><g transform="translate(24 170)"><rect width="812" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="27" font-size="18">🖋</text><text x="52" y="20" font-size="15" font-weight="700" fill="#1f2328">3. Write a skill</text><text x="52" y="35" font-size="12.5" fill="#57606a">make-me-a-skill, then skillcheck</text><text x="788" y="27" text-anchor="end" font-size="13" fill="#c46f1f" font-weight="700">3 people</text></g><g transform="translate(24 220)"><rect width="812" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="27" font-size="18">👀</text><text x="52" y="20" font-size="15" font-weight="700" fill="#1f2328">4. Review</text><text x="52" y="35" font-size="12.5" fill="#57606a">Check other people's skills and translations</text><text x="788" y="27" text-anchor="end" font-size="13" fill="#c46f1f" font-weight="700">0 people</text></g><g transform="translate(24 270)"><rect width="812" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="27" font-size="18">🚧</text><text x="52" y="20" font-size="15" font-weight="700" fill="#1f2328">5. Maintain</text><text x="52" y="35" font-size="12.5" fill="#57606a">Look after a bundle or a language</text><text x="788" y="27" text-anchor="end" font-size="13" fill="#c46f1f" font-weight="700">1 person</text></g></svg>
