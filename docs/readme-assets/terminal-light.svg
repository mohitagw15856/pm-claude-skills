x}}.t13{animation:t13 60s infinite steps(25,end)}@keyframes t13c{0%,35.17%{transform:translateX(0);opacity:.75}38.75%{transform:translateX(214px);opacity:.75}40.08%,100%{transform:translateX(214px);opacity:0}}.t13c{animation:t13c 60s infinite steps(25,end)}@keyframes e14{0%,40.07%{opacity:0}40.08%,66.17%{opacity:1}66.67%,100%{opacity:0}}.e14{animation:e14 60s infinite;opacity:0}@keyframes e15{0%,41.73%{opacity:0}41.75%,66.17%{opacity:1}66.67%,100%{opacity:0}}.e15{animation:e15 60s infinite;opacity:0}@keyframes e16{0%,42.65%{opacity:0}42.67%,66.17%{opacity:1}66.67%,100%{opacity:0}}.e16{animation:e16 60s infinite;opacity:0}@keyframes e17{0%,43.57%{opacity:0}43.58%,66.17%{opacity:1}66.67%,100%{opacity:0}}.e17{animation:e17 60s infinite;opacity:0}@keyframes e18{0%,66.98%{opacity:0}67.00%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e18{animation:e18 60s infinite;opacity:0}@keyframes e19{0%,68.48%{opacity:0}68.50%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e19{animation:e19 60s infinite;opacity:0}@keyframes t20{0%,68.50%{width:0}73.83%,100%{width:416px}}.t20{animation:t20 60s infinite steps(48,end)}@keyframes t20c{0%,68.50%{transform:translateX(0);opacity:.75}73.83%{transform:translateX(416px);opacity:.75}75.17%,100%{transform:translateX(416px);opacity:0}}.t20c{animation:t20c 60s infinite steps(48,end)}@keyframes e21{0%,75.15%{opacity:0}75.17%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e21{animation:e21 60s infinite;opacity:0}@keyframes e22{0%,76.82%{opacity:0}76.83%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e22{animation:e22 60s infinite;opacity:0}@keyframes e23{0%,77.73%{opacity:0}77.75%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e23{animation:e23 60s infinite;opacity:0}@keyframes e24{0%,78.65%{opacity:0}78.67%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e24{animation:e24 60s infinite;opacity:0}@keyframes e25{0%,79.57%{opacity:0}79.58%,99.50%{opacity:1}100.00%,100%{opacity:0}}.e25{animation:e25 60s infinite;opacity:0}
