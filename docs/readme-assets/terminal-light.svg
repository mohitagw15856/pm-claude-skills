  <rect width="860" height="370" rx="18" fill="#f7f4ee"/>
  <rect x="16" y="16" width="828" height="338" rx="14" fill="#ffffff" stroke="#e3ddd2"/>
  <circle cx="40" cy="40" r="5" fill="#ff5f57"/><circle cx="58" cy="40" r="5" fill="#febc2e"/><circle cx="76" cy="40" r="5" fill="#28c840"/>
  <text x="96" y="44" class="title">Terminal · install once, then just ask</text>
  <path d="M16 60H844" stroke="#e3ddd2"/>
  <g class="e0"><text x="40" y="92" class="pr">$ </text><clipPath id="t1k"><rect class="t1" x="57" y="74" width="0" height="26"/></clipPath><text x="57" y="92" class="cmd" clip-path="url(#t1k)">npx pm-claude-skills add</text><rect class="t1c cur" x="58" y="78" width="8" height="17"/></g><text x="40" y="118" class="dim e2">Installing for 'claude' into ~/.claude/skills</text><text x="40" y="144" class="ok e3">Installed 1,285 item(s) for 'claude'.</text><g class="e4"><text x="40" y="180" class="pr">› </text><clipPath id="t5k"><rect class="t5" x="57" y="162" width="0" height="26"/></clipPath><text x="57" y="180" class="ask" clip-path="url(#t5k)">Write a PRD for offline mode in our notes app</text><rect class="t5c cur" x="58" y="166" width="8" height="17"/></g><g class="e6"><rect x="40" y="193" width="143" height="28" rx="14" fill="#efe6fb"/><text x="53" y="212" class="chip">⚡ prd-template</text><text x="195" y="212" class="dim">skill loaded</text></g><text x="40" y="246" class="out e7"># PRD: Offline mode for Notes</text><text x="40" y="272" class="out e8">Problem · Goals · Non-goals · 6 user stories · Metrics</text><text x="40" y="298" class="out e9">Open question: who wins when two devices edit offline?</text><text x="40" y="324" class="ok e10">✅ Saved as prd-offline-mode.md</text><text x="40" y="92" class="dim e11"># same session, all 1,285 skills on hand, a new request</text><g class="e12"><text x="40" y="128" class="pr">› </text><clipPath id="t13k"><rect class="t13" x="57" y="110" width="0" height="26"/></clipPath><text x="57" y="128" class="ask" clip-path="url(#t13k)">Should we ship on Friday?</text><rect class="t13c cur" x="58" y="114" width="8" height="17"/></g><g class="e14"><rect x="40" y="141" width="143" height="28" rx="14" fill="#efe6fb"/><text x="53" y="160" class="chip">⚡ ship-or-slip</text><text x="195" y="160" class="dim">skill loaded</text></g><text x="40" y="194" class="out e15">ship 0.18 · ship reduced 0.71 · slip 0.11</text><text x="40" y="220" class="out e16">The fact that flips it: payments sign-off</text><text x="40" y="246" class="ok e17">✅ Ship reduced, with the EU flag off</text><text x="40" y="92" class="dim e18"># same session, all 1,285 skills on hand, a new request</text><g class="e19"><text x="40" y="128" class="pr">› </text><clipPath id="t20k"><rect class="t20" x="57" y="110" width="0" height="26"/></clipPath><text x="57" y="128" class="ask" clip-path="url(#t20k)">Turn these notes into an update for the exec team</text><rect class="t20c cur" x="58" y="114" width="8" height="17"/></g><g class="e21"><rect x="40" y="141" width="190" height="28" rx="14" fill="#efe6fb"/><text x="53" y="160" class="chip">⚡ stakeholder-update</text><text x="242" y="160" class="dim">skill loaded</text></g><text x="40" y="194" class="out e22">TL;DR: launch moves a week; scope and budget unchanged</text><text x="40" y="220" class="out e23">🟢 Payments · 🟡 Onboarding (waiting on legal) · 🟢 Mobile</text><text x="40" y="246" class="out e24">Decision needed: approve the extra QA contractor by Thursday</text><text x="40" y="272" class="ok e25">✅ Ready to paste into Slack or email</text>
</svg>
