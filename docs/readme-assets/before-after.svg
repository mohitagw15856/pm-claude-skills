    <text x="56" y="97" class="ask" clip-path="url(#c0)">What am I signing? Here is my lease, £1,800 a month.</text>
  </g>
  <text x="58" y="196" class="g0_0 gen">Leases can be complex legal documents.</text>
  <text x="58" y="226" class="g0_1 gen">Read every clause carefully before signing.</text>
  <text x="58" y="256" class="g0_2 gen">Consider consulting a professional.</text>
  <g class="k0"><rect x="715.3" y="139" width="132.7" height="26" rx="13" fill="#3b2f4f"/><text x="728.3" y="157" class="chip">⚡ lease-decoder</text></g>
  <text x="482" y="196" class="s0_0 out">🔴 §14 auto-renews for 12 months unless 60 days' notice</text>
  <text x="482" y="226" class="s0_1 out">🔴 §9 leaving at month 6 costs £3,600 (two months)</text>
  <text x="482" y="256" class="s0_2 out">🟡 §11 entry "at any reasonable time": ask for 24 h</text>
  <text x="482" y="286" class="s0_3 out">🟢 §3 rent and §5 utilities: standard, skip these</text>
  <g class="v0"><text x="58" y="324" class="vb">✗ Nothing you can act on</text><text x="482" y="324" class="vg">✓ Ready to use</text></g>
