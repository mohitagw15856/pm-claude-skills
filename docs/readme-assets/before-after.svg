    <rect x="40" y="72" width="490.7999999999996" height="40" rx="13" fill="#2c3a4a"/>
    <clipPath id="c1"><rect class="ty1" x="50" y="76" width="0" height="32"/></clipPath>
    <text x="56" y="97" class="ask" clip-path="url(#c1)">Turn these notes into a PRD for the support dashboard.</text>
  </g>
  <text x="58" y="196" class="g1_0 gen">A PRD should cover goals and requirements.</text>
  <text x="58" y="226" class="g1_1 gen">Align with your stakeholders early.</text>
  <text x="58" y="256" class="g1_2 gen">Think about what your users need.</text>
  <g class="k1"><rect x="723.2" y="139" width="124.80000000000001" height="26" rx="13" fill="#3b2f4f"/><text x="736.2" y="157" class="chip">⚡ prd-template</text></g>
  <text x="482" y="196" class="s1_0 out">Problem: agents lose 2.3 h a day across 3 tools</text>
  <text x="482" y="226" class="s1_1 out">Metric: response time 4 h → 1 h, CSAT 3.8 → 4.5</text>
  <text x="482" y="256" class="s1_2 out">US1 Unified inbox: email, chat and social in one queue</text>
  <text x="482" y="286" class="s1_3 out">Open questions: each with an owner and a date</text>
  <g class="v1"><text x="58" y="324" class="vb">✗ Nothing you can act on</text><text x="482" y="324" class="vg">✓ Ready to use</text></g>
  <g class="b2">
    <rect x="40" y="72" width="249.5" height="40" rx="13" fill="#2c3a4a"/>
    <clipPath id="c2"><rect class="ty2" x="50" y="76" width="0" height="32"/></clipPath>
    <text x="56" y="97" class="ask" clip-path="url(#c2)">帮我把这些笔记整理成周报。</text>
  </g>
