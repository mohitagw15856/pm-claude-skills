  <text x="58" y="226" class="g2_1 gen">相关任务持续跟进。</text>
  <text x="58" y="256" class="g2_2 gen">下周继续努力。</text>
  <g class="k2"><rect x="691.6" y="139" width="156.4" height="26" rx="13" fill="#3b2f4f"/><text x="704.6" y="157" class="chip">⚡ cn-weekly-report</text></g>
  <text x="482" y="196" class="s2_0 out">一、本周完成：支付页改版上线，转化率 3.1% → 3.6%</text>
