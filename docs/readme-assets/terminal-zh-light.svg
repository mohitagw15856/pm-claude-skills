  <rect width="860" height="370" rx="18" fill="#f7f4ee"/>
  <rect x="16" y="16" width="828" height="338" rx="14" fill="#ffffff" stroke="#e3ddd2"/>
  <circle cx="40" cy="40" r="5" fill="#ff5f57"/><circle cx="58" cy="40" r="5" fill="#febc2e"/><circle cx="76" cy="40" r="5" fill="#28c840"/>
  <text x="96" y="44" class="title">终端 · 装一次，之后直接说需求</text>
  <path d="M16 60H844" stroke="#e3ddd2"/>
  <g class="e0"><text x="40" y="92" class="pr">$ </text><clipPath id="t1k"><rect class="t1" x="57" y="74" width="0" height="26"/></clipPath><text x="57" y="92" class="cmd" clip-path="url(#t1k)">npx --registry=https://registry.npmmirror.com pm-claude-skills add</text><rect class="t1c cur" x="58" y="78" width="8" height="17"/></g><text x="40" y="118" class="dim e2">Installing for 'claude' into ~/.claude/skills</text><text x="40" y="144" class="ok e3">Installed 1,250 item(s) for 'claude'.</text><g class="e4"><text x="40" y="180" class="pr">› </text><clipPath id="t5k"><rect class="t5" x="57" y="162" width="0" height="26"/></clipPath><text x="57" y="180" class="ask" clip-path="url(#t5k)">帮我写周报：支付页改版上线了，转化率 3.1% 到 3.6%</text><rect class="t5c cur" x="58" y="166" width="8" height="17"/></g><g class="e6"><rect x="40" y="193" width="175" height="28" rx="14" fill="#efe6fb"/><text x="53" y="212" class="chip">⚡ cn-weekly-report</text><text x="227" y="212" class="dim">已加载技能</text></g><text x="40" y="246" class="out e7">一、本周完成：支付页改版上线，转化率 3.1% → 3.6%</text><text x="40" y="272" class="out e8">二、下周计划：灰度扩大到全量，补齐埋点</text><text x="40" y="298" class="out e9">三、问题与风险：埋点未就绪，A/B 测试可能延期</text><text x="40" y="324" class="ok e10">✅ 一句话版本已生成，可以直接发群</text><text x="40" y="92" class="dim e11"># 同一个会话，1,250 个技能都在，换个问题</text><g class="e12"><text x="40" y="128" class="pr">› </text><clipPath id="t13k"><rect class="t13" x="57" y="110" width="0" height="26"/></clipPath><text x="57" y="128" class="ask" clip-path="url(#t13k)">公司要裁我，工作 6 年 7 个月，能拿多少？</text><rect class="t13c cur" x="58" y="114" width="8" height="17"/></g><g class="e14"><rect x="40" y="141" width="229" height="28" rx="14" fill="#efe6fb"/><text x="53" y="160" class="chip">⚡ cn-severance-calculator</text><text x="281" y="160" class="dim">已加载技能</text></g><text x="40" y="194" class="out e15">适用情形：协商解除，N = 7 个月工资</text><text x="40" y="220" class="out e16">🟡 月工资超过当地社平三倍时有封顶，需核对</text><text x="40" y="246" class="ok e17">✅ 签字前核对：未休年假工资、年终奖、社保</text><text x="40" y="92" class="dim e18"># 同一个会话，1,250 个技能都在，换个问题</text><g class="e19"><text x="40" y="128" class="pr">› </text><clipPath id="t20k"><rect class="t20" x="57" y="110" width="0" height="26"/></clipPath><text x="57" y="128" class="ask" clip-path="url(#t20k)">下个月公务员面试，帮我模拟一轮</text><rect class="t20c cur" x="58" y="114" width="8" height="17"/></g><g class="e21"><rect x="40" y="141" width="229" height="28" rx="14" fill="#efe6fb"/><text x="53" y="160" class="chip">⚡ cn-civil-exam-interview</text><text x="281" y="160" class="dim">已加载技能</text></g><text x="40" y="194" class="out e22">第 1 题（应急应变）：暴雨导致窗口排长队</text><text x="40" y="220" class="out e23">用时 2:45 · 内容 4 · 结构 3 · 岗位匹配 4</text><text x="40" y="246" class="ok e24">✅ 改进：先安抚，再分流，最后上报</text>
</svg>
