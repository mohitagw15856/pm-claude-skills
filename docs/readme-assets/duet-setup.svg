<text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">Set up your always-on agent in five steps</text>
<text x="460" y="64" text-anchor="middle" font-size="13" fill="#8b949e">Do these once, before the agent starts. Each step is one skill.</text>
<rect x="20" y="92" width="160" height="170" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="100" cy="132" r="22" fill="#58a6ff"/><text x="100" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">1</text><text x="100" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Audit</text><text x="100" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#58a6ff">prepare-for-duet</text><text x="100" y="238" text-anchor="middle" font-size="11.5" fill="#8b949e">what helps or hurts an agent</text>
<text x="190" y="182" text-anchor="middle" font-size="18" fill="#8b949e">›</text>
<rect x="200" y="92" width="160" height="170" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="280" cy="132" r="22" fill="#d2a8ff"/><text x="280" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">2</text><text x="280" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Standing orders</text><text x="280" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#d2a8ff">standing-orders</text><text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#8b949e">always, never, VIPs, tone</text>
<text x="370" y="182" text-anchor="middle" font-size="18" fill="#8b949e">›</text>
<rect x="380" y="92" width="160" height="170" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="460" cy="132" r="22" fill="#d29922"/><text x="460" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">3</text><text x="460" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Approval policy</text><text x="460" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#d29922">approval-policy-designer</text><text x="460" y="238" text-anchor="middle" font-size="11.5" fill="#8b949e">act · ask · never, per app</text>
<text x="550" y="182" text-anchor="middle" font-size="18" fill="#8b949e">›</text>
<rect x="560" y="92" width="160" height="170" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="640" cy="132" r="22" fill="#3fb950"/><text x="640" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">4</text><text x="640" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Brief and alerts</text><text x="640" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#3fb950">morning-brief-designer</text><text x="640" y="238" text-anchor="middle" font-size="11.5" fill="#8b949e">what it tells you, and when</text>
<text x="730" y="182" text-anchor="middle" font-size="18" fill="#8b949e">›</text>
<rect x="740" y="92" width="160" height="170" rx="14" fill="#161b22" stroke="#30363d"/><circle cx="820" cy="132" r="22" fill="#f85149"/><text x="820" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">5</text><text x="820" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Kill switch</text><text x="820" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#f85149">agent-kill-switch-plan</text><text x="820" y="238" text-anchor="middle" font-size="11.5" fill="#8b949e">stop it in under a minute</text>
<text x="40" y="306" font-size="14" font-weight="700" fill="#e6edf3">Then install, three ways</text>
<rect x="20" y="320" width="280" height="78" rx="12" fill="#1c2330" stroke="#30363d"/><text x="38" y="348" font-size="14" font-weight="700" fill="#d2a8ff">⬇ Add to Claude</text><text x="38" y="368" font-size="12" fill="#e6edf3">a ZIP on every skill page</text><text x="38" y="386" font-size="11.5" fill="#8b949e">upload in claude.ai: works in Duet</text>
<rect x="320" y="320" width="280" height="78" rx="12" fill="#1c2330" stroke="#30363d"/><text x="338" y="348" font-size="14" font-weight="700" fill="#d2a8ff">📦 A starter pack</text><text x="338" y="368" font-size="12" fill="#e6edf3">3–4 skills for your job</text><text x="338" y="386" font-size="11.5" fill="#8b949e">founder · freelancer · shop · team · ops</text>
<rect x="620" y="320" width="280" height="78" rx="12" fill="#1c2330" stroke="#30363d"/><text x="638" y="348" font-size="14" font-weight="700" fill="#d2a8ff">🧰 The whole bundle</text><text x="638" y="368" font-size="12" fill="#e6edf3">npx pm-claude-skills add</text><text x="638" y="386" font-size="11.5" fill="#8b949e">--bundle pm-duet</text>
