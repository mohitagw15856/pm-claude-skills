<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
<title>How it works: you ask in plain words, your AI matches a skill by its description, follows the skill file (framework, template, quality checks) and returns the finished deliverable. Skills reach your AI through the installer, the MCP server or the REST API.</title>
<rect width="920" height="400" rx="16" fill="#ffffff"/>
<text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">How a skill turns a request into a finished document</text>
<text x="460" y="64" text-anchor="middle" font-size="13" fill="#656d76">A skill is one markdown file. Nothing runs in the background, and uninstalling deletes text files.</text>
<rect x="20" y="88" width="204" height="150" rx="14" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><text x="122" y="134" text-anchor="middle" font-size="28">💬</text><text x="122" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">You ask in plain words</text><text x="122" y="196" text-anchor="middle" font-size="12" fill="#656d76">"Decode this lease</text><text x="122" y="214" text-anchor="middle" font-size="12" fill="#656d76">before I sign"</text>
<text x="235" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<rect x="246" y="88" width="204" height="150" rx="14" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><text x="348" y="134" text-anchor="middle" font-size="28">🎯</text><text x="348" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Your AI picks the skill</text><text x="348" y="196" text-anchor="middle" font-size="12" fill="#656d76">matched by its description,</text><text x="348" y="214" text-anchor="middle" font-size="12" fill="#656d76">loaded only when it fits</text>
<text x="461" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<rect x="472" y="88" width="204" height="150" rx="14" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><text x="574" y="134" text-anchor="middle" font-size="28">📄</text><text x="574" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">It follows SKILL.md</text><text x="574" y="196" text-anchor="middle" font-size="12" fill="#656d76">the framework, the template</text><text x="574" y="214" text-anchor="middle" font-size="12" fill="#656d76">and the quality checks</text>
<text x="687" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<rect x="698" y="88" width="204" height="150" rx="14" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><text x="800" y="134" text-anchor="middle" font-size="28">✅</text><text x="800" y="170" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">You get the deliverable</text><text x="800" y="196" text-anchor="middle" font-size="12" fill="#656d76">the finished document,</text><text x="800" y="214" text-anchor="middle" font-size="12" fill="#656d76">not advice about one</text>
<text x="40" y="276" font-size="14" font-weight="700" fill="#1f2328">Three ways skills reach your AI</text>
<rect x="20" y="292" width="280" height="84" rx="12" fill="#eef1f5" stroke="#d0d7de"/><text x="38" y="321" font-size="14" font-weight="700" fill="#8250df">🧰 The installer</text><text x="38" y="342" font-size="12" font-family="ui-monospace,monospace" fill="#1f2328">npx pm-claude-skills add</text><text x="38" y="361" font-size="11.5" fill="#656d76">copies skills into your AI tool</text>
<rect x="320" y="292" width="280" height="84" rx="12" fill="#eef1f5" stroke="#d0d7de"/><text x="338" y="321" font-size="14" font-weight="700" fill="#8250df">🔌 The MCP server</text><text x="338" y="342" font-size="12" font-family="ui-monospace,monospace" fill="#1f2328">any MCP client</text><text x="338" y="361" font-size="11.5" fill="#656d76">serves the right skill on demand</text>
<rect x="620" y="292" width="280" height="84" rx="12" fill="#eef1f5" stroke="#d0d7de"/><text x="638" y="321" font-size="14" font-weight="700" fill="#8250df">🌐 The REST API</text><text x="638" y="342" font-size="12" font-family="ui-monospace,monospace" fill="#1f2328">n8n, Make, any HTTP tool</text><text x="638" y="361" font-size="11.5" fill="#656d76">read-only, for automations</text>
</svg>
