<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
<title>Set up a proactive agent in five steps with PM Skills: audit, standing orders, approval policy, brief and alerts, kill switch; then install by Add to Claude, a starter pack or the whole bundle.</title>
<rect width="920" height="420" rx="16" fill="#ffffff"/>
<text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Set up your always-on agent in five steps</text>
<text x="460" y="64" text-anchor="middle" font-size="13" fill="#656d76">Do these once, before the agent starts. Each step is one skill.</text>
<rect x="20" y="92" width="160" height="170" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="100" cy="132" r="22" fill="#0969da"/><text x="100" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text><text x="100" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Audit</text><text x="100" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#0969da">prepare-for-duet</text><text x="100" y="238" text-anchor="middle" font-size="11.5" fill="#656d76">what helps or hurts an agent</text>
<text x="190" y="182" text-anchor="middle" font-size="18" fill="#656d76">›</text>
<rect x="200" y="92" width="160" height="170" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="280" cy="132" r="22" fill="#8250df"/><text x="280" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text><text x="280" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Standing orders</text><text x="280" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#8250df">standing-orders</text><text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#656d76">always, never, VIPs, tone</text>
<text x="370" y="182" text-anchor="middle" font-size="18" fill="#656d76">›</text>
<rect x="380" y="92" width="160" height="170" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="460" cy="132" r="22" fill="#9a6700"/><text x="460" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text><text x="460" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Approval policy</text><text x="460" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#9a6700">approval-policy-designer</text><text x="460" y="238" text-anchor="middle" font-size="11.5" fill="#656d76">act · ask · never, per app</text>
<text x="550" y="182" text-anchor="middle" font-size="18" fill="#656d76">›</text>
<rect x="560" y="92" width="160" height="170" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="640" cy="132" r="22" fill="#1a7f37"/><text x="640" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text><text x="640" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Brief and alerts</text><text x="640" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#1a7f37">morning-brief-designer</text><text x="640" y="238" text-anchor="middle" font-size="11.5" fill="#656d76">what it tells you, and when</text>
<text x="730" y="182" text-anchor="middle" font-size="18" fill="#656d76">›</text>
<rect x="740" y="92" width="160" height="170" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><circle cx="820" cy="132" r="22" fill="#cf222e"/><text x="820" y="140" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">5</text><text x="820" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Kill switch</text><text x="820" y="208" text-anchor="middle" font-size="9.6" font-family="ui-monospace,monospace" fill="#cf222e">agent-kill-switch-plan</text><text x="820" y="238" text-anchor="middle" font-size="11.5" fill="#656d76">stop it in under a minute</text>
<text x="40" y="306" font-size="14" font-weight="700" fill="#1f2328">Then install, three ways</text>
<rect x="20" y="320" width="280" height="78" rx="12" fill="#eef1f5" stroke="#d0d7de"/><text x="38" y="348" font-size="14" font-weight="700" fill="#8250df">⬇ Add to Claude</text><text x="38" y="368" font-size="12" fill="#1f2328">a ZIP on every skill page</text><text x="38" y="386" font-size="11.5" fill="#656d76">upload in claude.ai: works in Duet</text>
<rect x="320" y="320" width="280" height="78" rx="12" fill="#eef1f5" stroke="#d0d7de"/><text x="338" y="348" font-size="14" font-weight="700" fill="#8250df">📦 A starter pack</text><text x="338" y="368" font-size="12" fill="#1f2328">3–4 skills for your job</text><text x="338" y="386" font-size="11.5" fill="#656d76">founder · freelancer · shop · team · ops</text>
<rect x="620" y="320" width="280" height="78" rx="12" fill="#eef1f5" stroke="#d0d7de"/><text x="638" y="348" font-size="14" font-weight="700" fill="#8250df">🧰 The whole bundle</text><text x="638" y="368" font-size="12" fill="#1f2328">npx pm-claude-skills add</text><text x="638" y="386" font-size="11.5" fill="#656d76">--bundle pm-duet</text>
