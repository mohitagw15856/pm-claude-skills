name: 'PM Skills document lint'
description: 'Deterministic checks on finished documents (PRDs, status updates, postmortems): placeholders left in, a PRD with no number in its metrics, action items with no owner. No model call.'
branding:
  icon: 'check-square'
  color: 'purple'
inputs:
  files:
    description: 'Markdown files to lint, separated by spaces. Shell globs are expanded, for example "docs/prd/*.md".'
    required: true
  type:
    description: 'Document type: auto, prd, update, postmortem, okr, meeting, roadmap, context or generic.'
    required: false
    default: 'auto'
  strict:
    description: 'Set to "true" to fail on warnings as well as errors.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Lint documents
      shell: bash
      env:
        DOCLINT_FILES: ${{ inputs.files }}
        DOCLINT_TYPE: ${{ inputs.type }}
        DOCLINT_STRICT: ${{ inputs.strict }}
        DOCLINT_BIN: ${{ github.action_path }}/../../../bin/doclint.mjs
      run: |
        set -euo pipefail
        case "$DOCLINT_TYPE" in auto|prd|update|postmortem|okr|meeting|roadmap|context|generic) ;; *) echo "::error::type is not one the linter knows"; exit 2 ;; esac
        # Inputs arrive through the environment, never pasted into the script, and the file
        # list is expanded as glob patterns only: no command in an input can run.
        shopt -s nullglob
        files=()
        for pattern in $DOCLINT_FILES; do
          for f in $pattern; do files+=("$f"); done
        done
        if [ "${#files[@]}" -eq 0 ]; then echo "::warning::No files matched: $DOCLINT_FILES"; exit 0; fi
        # --format github makes each finding appear on its line in the pull request.
        args=(--type "$DOCLINT_TYPE" --format github)
        if [ "$DOCLINT_STRICT" = "true" ]; then args+=(--strict); fi
        node "$DOCLINT_BIN" "${files[@]}" "${args[@]}"
