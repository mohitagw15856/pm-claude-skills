name: "🎓 校园大使申请 / Campus ambassador"
description: 申请成为 PM Skills 校园大使，在你的学校办一场分享会或工作坊。Apply to run a talk or workshop at your university.
title: "[校园大使] <学校>"
labels: ["campus-ambassador"]
body:
  - type: markdown
    attributes:
      value: |
        先读一下[校园大使计划](https://github.com/mohitagw15856/pm-claude-skills/blob/main/docs/campus/ambassadors.md)。这是志愿项目，没有报酬。
        **Issue 是公开的：不要填写手机号、学号、微信号或其他个人信息。** Please do not post phone numbers or student IDs here.
  - type: input
    id: school
    attributes:
      label: 学校和院系 School
      placeholder: 例如：某某大学 计算机学院
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: 你的身份 Your role
      options:
        - 本科生 Undergraduate
        - 研究生 Postgraduate
        - 高职学生 Vocational student
        - 社团负责人 Society lead
        - 助教 Teaching assistant
        - 其他 Other
    validations:
      required: true
  - type: dropdown
    id: event
    attributes:
      label: 第一场活动 First event
      options:
        - 45 分钟技术分享会 Talk
        - 两小时社团工作坊 Workshop
        - 都想办 Both
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: 大概时间和规模 When and how many people
      placeholder: 例如：11 月中旬，30 人左右
  - type: textarea
    id: why
    attributes:
      label: 你用过哪些技能，为什么想办这场活动 Skills you have used and why
    validations:
      required: true
  - type: checkboxes
    id: agree
    attributes:
      label: 确认 Confirm
      options:
        - label: 活动中会说明学术诚信，不收集同学的个人信息，不以项目名义收费。I will cover academic integrity, collect no personal data and charge nothing in the project's name.
          required: true
