name: State of the library (monthly)

# On the 1st, writes last month's "state of the library" to newsletter/state/
# (scripts/build-monthly-state.mjs): skill changes, self-rewrites, the Firm's
# predictions, the Skill Cup, savings, quality and the scoreboard, from the
# repo's own records. No model calls. Lands through a self-merging data PR.
on:
  schedule:
    - cron: '30 6 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM (blank = last month)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Write the issue
        env:
          MONTH: ${{ inputs.month }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$MONTH" ]; then
            printf '%s' "$MONTH" | grep -Eq '^[0-9]{4}-[0-9]{2}$' || { echo "::error::month must be YYYY-MM"; exit 1; }
            node scripts/build-monthly-state.mjs --month "$MONTH"
          else
            node scripts/build-monthly-state.mjs
          fi
      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: newsletter/state/*.md
          branch: monthly-state
          delete-branch: true
          commit-message: "newsletter: state of the library"
          title: "newsletter: state of the library"
          body: Auto-generated by the **State of the library (monthly)** workflow.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^newsletter/state/([0-9]{4}-[0-9]{2}|README)\.md$'; then
            echo "::warning::PR #$PR changes unexpected files; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
