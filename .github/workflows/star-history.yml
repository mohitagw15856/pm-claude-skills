name: Star history

# Self-hosted star-history chart. The README used to embed star-history.com's
# SVG, but that service makes anonymous GitHub API calls and gets rate-limited
# (the image then shows a "please add a token" message). This regenerates the
# chart ourselves with the repo's GITHUB_TOKEN (5,000 req/hr) and commits a
# static SVG — no third party, never rate-limited. Run once now, then weekly.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # every Monday 04:17 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Regenerate the star-history chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-star-history.mjs

      # main is protected (requires PRs), so open a PR instead of pushing directly.
      # create-pull-request is a no-op when the chart is unchanged.
      - name: Open a PR if the chart changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: web/docs-assets/star-history.svg
          branch: star-history
          delete-branch: true
          commit-message: "chore: refresh star-history chart"
          title: "chore: refresh star-history chart"
          body: |
            Auto-generated by the Star history workflow: refreshes
            web/docs-assets/star-history.svg, with milestones from data/star-milestones.json.

      # Data-only PR: merge it straight away if it touches nothing but the expected files.
      # Anything else is left open for a person to review.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^web/docs-assets/star-history\.svg$'; then
            echo "::warning::PR #$PR changes files outside ^web/docs-assets/star-history\.svg$; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
