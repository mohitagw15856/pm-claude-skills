name: Repo vitals

# The self-operating repo: free scheduled upkeep. Results live on the
# `vitals-data` branch (main is PR-only for the workflow token), which
# web/status.html reads via raw.githubusercontent.
#
#   daily  — append runs-served + stars to history.json
#   weekly (Mon) — regenerate the State of Agent Skills census
#   weekly (Mon) — live re-scan of the community registry; opens an issue on failure
on:
  schedule:
    - cron: '18 5 * * *'    # daily snapshot
    - cron: '43 6 * * 1'    # weekly census + registry re-scan (Mondays)
  workflow_dispatch:

concurrency:
  group: repo-vitals
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  vitals:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Snapshot vitals (daily)
        run: |
          git checkout vitals-data 2>/dev/null || git checkout -b vitals-data
          git checkout main -- scripts/ skillspec/ community/ 2>/dev/null || true
          RUNS=$(curl -sf "https://pm-skills-mcp.pm-claude-skills.workers.dev/try/stats?format=json" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).freeRunsServed))" || echo null)
          STARS=$(gh api repos/${{ github.repository }} --jq .stargazers_count || echo null)
          # Distribution: weekly npm downloads per package, monthly PyPI. The
          # install claims in the growth docs had no tracked source — these are it.
          # Every fetch degrades to null; a flaky stats API must not fail vitals.
          NPMW=$(curl -sf "https://api.npmjs.org/downloads/point/last-week/pm-claude-skills" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).downloads))" || echo null)
          NPMTOOLS=$(curl -sf "https://api.npmjs.org/downloads/point/last-week/pm-skills-tools" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).downloads))" || echo null)
          NPMSPEC=$(curl -sf "https://api.npmjs.org/downloads/point/last-week/skillspec-check" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).downloads))" || echo null)
          PYPI=$(curl -sf "https://pypistats.org/api/packages/pm-skills/recent" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).data.last_month))" || echo null)
          SKILLPINGS=$(curl -sf "https://pm-skills-mcp.pm-claude-skills.workers.dev/stats/skills" | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>console.log(JSON.parse(b).total||0))" || echo null)
          node -e "
            const fs=require('fs');
            let h=[]; try{h=JSON.parse(fs.readFileSync('history.json','utf8'))}catch(_){}
            const today=new Date().toISOString().slice(0,10);
            h=h.filter(x=>x.d!==today);
            h.push({d:today, runs:${RUNS}, stars:${STARS}, npmWeek:${NPMW}, npmToolsWeek:${NPMTOOLS}, npmSpecWeek:${NPMSPEC}, pypiMonth:${PYPI}, skillPings:${SKILLPINGS}});
            fs.writeFileSync('history.json', JSON.stringify(h,null,1)+'\n');
            console.log('history:', h.length, 'days');
          "

      - name: Weekly census (Mondays)
        if: github.event.schedule == '43 6 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/skill-census.mjs --sample 100 && mkdir -p reports && cp docs/reports/state-of-agent-skills-*.md reports/ 2>/dev/null || true

      - name: Weekly staleness board (Mondays)
        if: github.event.schedule == '43 6 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        # Date-relative output, so it is published as a weekly report rather
        # than committed to main where it would break deterministic-build checks.
        run: mkdir -p reports && node scripts/check-staleness.mjs --md > reports/staleness.md

      - name: Weekly registry re-scan (Mondays)
        if: github.event.schedule == '43 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          if ! node scripts/check-registry.mjs --fetch 2>err.log; then
            gh issue list --label registry-health --state open --json number --jq length | grep -q '^0$' && \
              gh issue create --title "Registry health: live re-scan failed $(date +%Y-%m-%d)" \
                --label registry-health \
                --body "$(printf 'The weekly live validation of community/registry.json failed — an entry is dead, moved, or no longer matches its sha256 pin.\n\n```\n%s\n```\nPer the house rules, broken entries >30 days get removed.' "$(cat err.log | head -30)")" || true
            echo "registry scan FAILED (issue filed)";
          else echo "registry clean"; fi

      - name: Commit to vitals-data
        run: |
          git config user.name "vitals-bot"
          git config user.email "actions@github.com"
          git rm -r --cached scripts skillspec community 2>/dev/null || true
          rm -rf scripts skillspec community docs err.log 2>/dev/null || true
          # This branch is data, not a site: one history.json and no web/. The
          # root Vercel project deploys every branch and expects outputDirectory
          # "web", so each daily push here failed a Preview build. Opting the
          # branch out has to live on the branch itself, because that is the
          # commit Vercel reads.
          printf '%s\n' '{ "git": { "deploymentEnabled": { "vitals-data": false } } }' > vercel.json
          git add history.json reports vercel.json 2>/dev/null || git add history.json vercel.json
          git diff --cached --quiet || git commit -m "vitals: $(date +%Y-%m-%d)"
          git push -f origin vitals-data
