name: Publish pm-skills-tools to npm

# Publishes the agent-tools subpackage (tools-pkg/). Its generated files are not
# committed: prepack builds them from skills/. The version tracks the library
# (tools-pkg/package.json). Manual dispatch, or npm publish from tools-pkg/ at release.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Freshness + self-test
        run: |
          node scripts/build-tools-exports.mjs
          node --input-type=module -e "import { pick, toOpenAI } from './tools-pkg/tools.mjs'; if (toOpenAI(pick(['prd_template'])).length !== 1) process.exit(1); console.log('self-test ok');"
      - name: Publish (public, with provenance)
        working-directory: tools-pkg
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
