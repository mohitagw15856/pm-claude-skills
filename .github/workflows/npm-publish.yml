name: Publish to npm

# Publishes the package to npm when you publish a GitHub Release (or run this
# workflow manually), using npm trusted publishing (OIDC): GitHub proves to npm
# that this workflow in this repo is publishing, so no long-lived token is needed
# and none can expire. NPM_TOKEN stays as a fallback while the switch is made.
#
# One-time setup on npmjs.com (the package owner):
#   pm-claude-skills -> Settings -> Trusted publishing -> GitHub Actions:
#     Organization or user: mohitagw15856
#     Repository:           pm-claude-skills
#     Workflow filename:    npm-publish.yml
#     Environment:          (leave empty)
#   Once a release has published through OIDC, delete the NPM_TOKEN secret.
# Then: publish a GitHub Release tagged vX.Y.Z (matching package.json version).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # enables npm provenance (a verified "published from this repo" badge)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#[vV]}"   # strip a leading v or V (v17.0.0 / V17.0.0)
          PKG="$(node -p "require('./package.json').version")"
          echo "release tag: $TAG | package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG). Bump package.json or fix the tag."
            exit 1
          fi

      # Skip rather than fail when the version is already on npm. A maintainer
      # who published by hand before tagging, or a re-run of this workflow, both
      # hit E403 "cannot publish over the previously published versions" — which
      # leaves a red X on a release that is in fact fine. The tag/version match
      # is checked above, so the only way to reach here with the version already
      # present is a duplicate publish, not a wrong one.
      - name: Is this version already on npm?
        id: published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "pm-claude-skills@${PKG}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pm-claude-skills@${PKG} is already on npm — nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        if: steps.published.outputs.already == 'false'
        run: npm install -g npm@^11.6.0 && npm --version

      # OIDC first: with trusted publishing configured, npm exchanges the GitHub
      # identity token for a short-lived publish credential. If that is not set up
      # yet, fall back to the NPM_TOKEN secret, and say clearly which one was used.
      - name: Publish to npm (trusted publishing, provenance)
        if: steps.published.outputs.already == 'false'
        env:
          FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          # setup-node writes an .npmrc that expects NODE_AUTH_TOKEN; leave it empty for OIDC.
          if NODE_AUTH_TOKEN="" npm publish --provenance --access public; then
            echo "::notice::Published with npm trusted publishing (OIDC)."
            exit 0
          fi
          if [ -z "$FALLBACK_TOKEN" ]; then
            echo "::error::Trusted publishing failed and there is no NPM_TOKEN fallback. Configure trusted publishing on npmjs.com (see the header of this workflow)."
            exit 1
          fi
          echo "::warning::Trusted publishing is not configured yet; publishing with NPM_TOKEN instead."
          NODE_AUTH_TOKEN="$FALLBACK_TOKEN" npm publish --provenance --access public
