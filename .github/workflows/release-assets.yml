name: Release assets

# Attaches the offline bundle to each GitHub release: skills, every export, the
# pipelines and contracts, the playground with its built catalogue and the Org
# Edition server, as one .tar.zst with a .sha256 beside it. Anyone can then run
# `npx pm-claude-skills serve --bundle <file>` on a laptop with no network.
# One run per release, or by hand for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the bundle to (for example v83.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the generated inputs (catalogue and exports)
        run: |
          node web/build-skills.mjs
          node scripts/build-exports.mjs
      - name: Build the offline bundle
        run: node scripts/build-offline-bundle.mjs --zstd
      - name: Check the archive against its hash
        run: cd dist && sha256sum -c ./*.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad tag $TAG"; exit 1; }
          gh release upload "$TAG" dist/*.tar.zst dist/*.sha256 --clobber
