name: Check generated artifacts

# Skills are the single source of truth. The web index (web/skills.json) is
# generated from skills/*/SKILL.md and committed; this job fails if it is stale.
# The multi-platform exports (exports/) are no longer committed: they are built
# here and linted, built before npm publish, and published to the 'exports' branch.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'plugins/**'
      - 'web/build-skills.mjs'
      - 'scripts/build-exports.mjs'
      - 'web/skills.json'
      - 'web/skills-index.json'
      - 'skill-dupes-allow.json'
      - 'scripts/build-disambiguation.mjs'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/build-exports.mjs'
      - 'web/build-skills.mjs'
      - 'web/skills.json'
      - 'web/skills-index.json'
      - 'skill-dupes-allow.json'
      - 'scripts/build-disambiguation.mjs'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and lint the multi-platform exports
        run: |
          node scripts/build-exports.mjs
          node tests/exports-lint.mjs

      - name: Verify web/skills.json is up to date
        run: |
          node web/build-skills.mjs
          git diff --exit-code -- web/skills.json web/skills-index.json \
            || (echo "::error::web/skills.json or web/skills-index.json is stale — run 'node web/build-skills.mjs' and commit." && exit 1)

      - name: Verify DISAMBIGUATION.md is up to date
        run: node scripts/build-disambiguation.mjs --check
