name: AI at work report

# "Which AI is best at your job?" — monthly. Runs SkillBench (skillbench/tasks.json)
# on every model listed in the AI_AT_WORK_MODELS repository variable whose provider
# key is set (--skip-missing-keys), then writes this month's edition to
# skillbench/reports/ai-at-work/YYYY-MM.md. The page (web/ai-at-work.html) is built
# from the same data at deploy. To add a provider, add its key as a secret
# (OPENAI_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY, …) and its model id to the
# variable. A model whose run fails entirely keeps its previous scores.
on:
  schedule:
    - cron: '0 4 2 * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model ids (blank = the AI_AT_WORK_MODELS variable)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-at-work-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run SkillBench on every model with a key
        env:
          MODELS: ${{ inputs.models || vars.AI_AT_WORK_MODELS || 'claude-haiku-4-5-20251001,claude-sonnet-5,claude-opus-5-5,gpt-5,gemini-2.5-pro,deepseek-chat,hf:Qwen/Qwen3.8-27B' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$MODELS" | grep -Eq '^[A-Za-z0-9._:,/-]+$' || { echo "::error::models must be comma-separated ids"; exit 1; }
          node skillbench/run-skillbench.mjs --models "$MODELS" --judge claude-sonnet-4-6 --skip-missing-keys
      - name: Write this month's edition
        run: node scripts/build-ai-at-work-report.mjs --edition "$(date -u +%Y-%m)"
      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            skillbench/results.json
            skillbench/reports/ai-at-work/*.md
          branch: ai-at-work-report
          delete-branch: true
          commit-message: "chore(bench): AI at work report, monthly edition"
          title: "chore(bench): AI at work report, monthly edition"
          body: |
            Auto-generated by the **AI at work report** workflow: fresh SkillBench runs
            and this month's edition of "Which AI is best at your job?".

      # Data-only PR: merge it straight away if it touches nothing but the expected files.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^skillbench/(results\.json|reports/ai-at-work/[0-9]{4}-[0-9]{2}\.md)$'; then
            echo "::warning::PR #$PR changes unexpected files; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
