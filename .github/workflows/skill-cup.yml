name: Skill Cup

# The monthly Skill Cup (SKILL-CUP.md). A maintainer dispatches this with an
# entry's PR number to score it (scripts/score-cup-entry.mjs: SkillSpec L3, then
# the skill runs on its own eval cases and a pinned judge scores the output). The
# PR's files are read through the API as data and never executed. Every day it
# also closes a finished month and opens the next theme (free). Results land
# through a data-only pull request that merges itself.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Cup entry PR number to score (blank = only roll the month over)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skill-cup
  cancel-in-progress: false

jobs:
  cup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Close a finished month
        run: node scripts/close-skill-cup.mjs
      - name: Score the entry
        if: inputs.pr != ''
        env:
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$PR" | grep -Eq '^[0-9]+$' || { echo "::error::pr must be a number"; exit 1; }
          if node scripts/score-cup-entry.mjs --pr "$PR" 2> err.txt; then
            node scripts/close-skill-cup.mjs
            gh pr comment "$PR" --body-file .cup-result
            rm -f .cup-result
          else
            cat err.txt
            gh pr comment "$PR" --body "Skill Cup: $(tr -d '\`' < err.txt)"
            exit 1
          fi
      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/skill-cup.json
            SKILL-CUP.md
          branch: skill-cup
          delete-branch: true
          commit-message: "data: Skill Cup update"
          title: "data: Skill Cup update"
          body: Auto-generated by the **Skill Cup** workflow.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(data/skill-cup\.json|SKILL-CUP\.md)$'; then
            echo "::warning::PR #$PR changes unexpected files; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
