name: Build Dify plugin

# Packages integrations/dify-plugin (with the trained skill router and index) using
# Dify's official CLI, pinned by checksum, so a change that breaks packaging fails
# here. Releases are immutable, so the published copy is built by
# deploy-playground.yml and served from Pages at /dify/pm_skills.difypkg.
on:
  pull_request:
    paths:
      - 'integrations/dify-plugin/**'
      - 'scripts/build-dify-plugin.mjs'
      - '.github/workflows/publish-dify-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build plugin data
        run: |
          node scripts/build-dataset.mjs
          node scripts/build-dify-plugin.mjs
      - name: Test the plugin core
        working-directory: integrations/dify-plugin
        run: python3 test_core.py
      - name: Package with the Dify CLI
        env:
          CLI_URL: https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.10/dify-plugin-linux-amd64
          CLI_SHA256: 0cef74bcae375a4337c2ff7d42e4787717981a795e1c23cf56bb27ec07ec8304
        run: |
          set -euo pipefail
          curl -fsSL -o dify "$CLI_URL"
          echo "${CLI_SHA256}  dify" | sha256sum -c -
          chmod +x dify
          ./dify plugin package integrations/dify-plugin -o pm_skills.difypkg
      - uses: actions/upload-artifact@v7
        with:
          name: pm_skills.difypkg
          path: pm_skills.difypkg
