name: Deploy Skill Playground

# Rebuilds web/skills.json from the SKILL.md files and publishes web/ to
# GitHub Pages. Runs on every push to main that touches skills or the web app,
# so the live site always reflects the current skill library.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'web/**'
      - 'skillbench/results.json'
      - 'evals/results.json'
      - 'skill-tiers.json'
      - 'skill-sources.json'
      - 'giscus.json'
      - 'sponsors.json'
      - 'scripts/build-docs.mjs'
      - 'scripts/build-leaderboard.mjs'
      - 'scripts/build-coverage.mjs'
      - 'scripts/build-skill-pages.mjs'
      - 'scripts/build-skill-changelog.mjs'
      - 'scripts/build-community.mjs'
      - 'scripts/build-samples.mjs'
      - 'examples/samples/**'
      - 'site/tech-tree/**'
      - 'scripts/build-tech-tree.mjs'
      - 'integrations/dify-plugin/**'
      - 'scripts/build-dify-plugin.mjs'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Rebuild skills.json from SKILL.md files
        run: node web/build-skills.mjs

      - name: Build llms.txt (agent/answer-engine discovery)
        run: node scripts/build-llms-txt.mjs

      - name: Build the static skill catalog (web/catalog.html)
        run: node scripts/build-docs.mjs

      - name: Build the sample-output gallery data (web/samples.json)
        run: node scripts/build-samples.mjs

      - name: Build per-skill SEO pages + sitemap (web/skill/*.html)
        run: node scripts/build-skill-pages.mjs

      - name: Build per-skill change history (web/skill-changelog.json)
        run: node scripts/build-skill-changelog.mjs

      - name: Build the community hub (web/community.html)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-community.mjs

      - name: Build the skill leaderboard (web/leaderboard.html)
        run: node scripts/build-leaderboard.mjs

      - name: Build the eval-coverage page (web/coverage.html)
        run: node scripts/build-coverage.mjs

      - name: Build the model leaderboard data (web/modelbench.json)
        run: node scripts/build-modelbench.mjs

      - name: Build the tech tree (site/tech-tree, published at /tech-tree/)
        run: |
          node scripts/build-tech-tree.mjs
          mkdir -p web/tech-tree
          cp site/tech-tree/index.html site/tech-tree/data.json web/tech-tree/

      # Releases are immutable, so the Dify plugin is served from Pages at
      # /dify/pm_skills.difypkg instead of attached to a release.
      - name: Package the Dify plugin (published at /dify/pm_skills.difypkg)
        env:
          CLI_URL: https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.10/dify-plugin-linux-amd64
          CLI_SHA256: 0cef74bcae375a4337c2ff7d42e4787717981a795e1c23cf56bb27ec07ec8304
        run: |
          set -euo pipefail
          node scripts/build-dataset.mjs
          node scripts/build-dify-plugin.mjs
          (cd integrations/dify-plugin && python3 test_core.py)
          curl -fsSL -o "$RUNNER_TEMP/dify" "$CLI_URL"
          echo "${CLI_SHA256}  $RUNNER_TEMP/dify" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/dify"
          mkdir -p web/dify
          "$RUNNER_TEMP/dify" plugin package integrations/dify-plugin -o web/dify/pm_skills.difypkg

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
