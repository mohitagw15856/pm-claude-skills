name: Deploy Skill Playground

# Rebuilds web/skills.json from the SKILL.md files and publishes web/ to
# GitHub Pages. Runs on every push to main that touches skills or the web app,
# so the live site always reflects the current skill library.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'skills-i18n/**'
      - 'scripts/build-share-cards.mjs'
      - 'scripts/build-offline-pack.mjs'
      - 'web/**'
      - 'skillbench/results.json'
      - 'evals/results.json'
      - 'skill-tiers.json'
      - 'skill-sources.json'
      - 'giscus.json'
      - 'sponsors.json'
      - 'scripts/build-docs.mjs'
      - 'scripts/build-leaderboard.mjs'
      - 'scripts/build-coverage.mjs'
      - 'scripts/build-skill-pages.mjs'
      - 'scripts/build-skill-changelog.mjs'
      - 'scripts/build-community.mjs'
      - 'scripts/build-samples.mjs'
      - 'examples/samples/**'
      - 'site/tech-tree/**'
      - 'scripts/build-tech-tree.mjs'
      - 'integrations/dify-plugin/**'
      - 'scripts/build-dify-plugin.mjs'
      - 'scripts/build-readme-live.mjs'
      - 'scripts/build-live-png.mjs'
      - 'bin/today.mjs'
      - 'scripts/build-zhoukan.mjs'
      - 'scripts/build-lobehub-agents.mjs'
      - 'scripts/build-used-by.mjs'
      - 'scripts/build-zh-landing.mjs'
      - 'scripts/build-release-bundle.mjs'
      - 'scripts/push-search-engines.mjs'
      - 'data/cn-city-data.json'
      - 'CHANGELOG.md'
      - 'data/solar-terms.json'
      - 'data/cn-exam-dates.json'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:
  # Daily rebuild for the live README cards in web/live/ (skill of the day,
  # stats, China status, exam countdowns, seasonal banner). 16:05 UTC is
  # 00:05 Beijing time, so the cards roll over at midnight for Chinese readers.
  # Nothing is committed: the images are built into the Pages artifact.
  schedule:
    - cron: '5 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write   # Sigstore build provenance for the release bundle

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Rebuild skills.json from SKILL.md files
        run: node web/build-skills.mjs

      - name: Build llms.txt (agent/answer-engine discovery)
        run: node scripts/build-llms-txt.mjs

      - name: Build the static skill catalog (web/catalog.html)
        run: node scripts/build-docs.mjs

      - name: Build the sample-output gallery data (web/samples.json)
        run: node scripts/build-samples.mjs

      - name: Build per-skill SEO pages + sitemap (web/skill/*.html)
        run: node scripts/build-skill-pages.mjs

      # Chinese pages for Baidu, Bing China and 360: /zh/<skill>.html and a hub,
      # appended to the sitemap built above.
      - name: Build the Chinese landing pages (web/zh/)
        run: node scripts/build-zh-landing.mjs

      - name: Build per-skill change history (web/skill-changelog.json)
        run: node scripts/build-skill-changelog.mjs

      - name: Build the community hub (web/community.html)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-community.mjs

      - name: Build the skill leaderboard (web/leaderboard.html)
        run: node scripts/build-leaderboard.mjs

      - name: Build the eval-coverage page (web/coverage.html)
        run: node scripts/build-coverage.mjs

      - name: Build the model leaderboard data (web/modelbench.json)
        run: node scripts/build-modelbench.mjs

      # Live README images, served at /live/<name>.svg and linked from both
      # READMEs. Network checks (stars, npm, Gitee, npmmirror, ModelScope) are
      # best effort: a source that does not answer renders as unknown.
      - name: Build the live README cards (web/live/, published at /live/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-readme-live.mjs

      # PNG copies for WeChat, Weibo and Xiaohongshu, which do not show SVG.
      # Best effort: a font or package hiccup must not block the deploy.
      - name: Render PNG copies of the live cards (web/live/png/)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install --prefix "$RUNNER_TEMP/resvg" --no-audit --no-fund @resvg/resvg-js@2.6.2 >/dev/null
          RESVG_MODULE_DIR="$RUNNER_TEMP/resvg/node_modules" node scripts/build-live-png.mjs

      - name: Report on the calendar data behind the live cards
        run: node scripts/check-date-data.mjs

      - name: Draft the Chinese weekly digest (web/live/zhoukan.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-zhoukan.mjs

      - name: Export the Chinese skills as LobeHub agents (web/lobehub/)
        run: node scripts/build-lobehub-agents.mjs

      # Code search may need a personal token (USED_BY_TOKEN, read-only public scope);
      # without one the page falls back to repository search and says so.
      - name: Build the Used by page (web/used-by.html)
        continue-on-error: true
        env:
          USED_BY_TOKEN: ${{ secrets.USED_BY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-used-by.mjs

      # A reproducible bundle of every skill plus a CycloneDX SBOM, signed with
      # GitHub's Sigstore-backed build provenance. Verify a download with:
      #   gh attestation verify pm-skills-<version>.tar.gz -R mohitagw15856/pm-claude-skills
      - name: Build the release bundle and SBOM (web/releases/)
        run: node scripts/build-release-bundle.mjs
      - name: Sign the release bundle (build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'web/releases/*.tar.gz, web/releases/*.sbom.cdx.json'

      # Search-engine ownership checks: Baidu reads a meta tag, IndexNow a key file.
      - name: Add search-engine verification
        env:
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${BAIDU_SITE_VERIFICATION:-}" ]; then
            printf '%s' "$BAIDU_SITE_VERIFICATION" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "::error::BAIDU_SITE_VERIFICATION must be the code only"; exit 1; }
            sed -i "s#<head>#<head>\n<meta name=\"baidu-site-verification\" content=\"${BAIDU_SITE_VERIFICATION}\" />#" web/index.html web/zh/index.html
          fi
          if [ -n "${INDEXNOW_KEY:-}" ]; then
            printf '%s' "$INDEXNOW_KEY" | grep -Eq '^[A-Za-z0-9-]{8,128}$' || { echo "::error::INDEXNOW_KEY must be 8-128 letters, digits or dashes"; exit 1; }
            printf '%s' "$INDEXNOW_KEY" > "web/${INDEXNOW_KEY}.txt"
          fi

      - name: Build the tech tree (site/tech-tree, published at /tech-tree/)
        run: |
          node scripts/build-tech-tree.mjs
          mkdir -p web/tech-tree
          cp site/tech-tree/index.html site/tech-tree/data.json web/tech-tree/

      # Releases are immutable, so the Dify plugin is served from Pages at
      # /dify/pm_skills.difypkg instead of attached to a release.
      - name: Package the Dify plugin (published at /dify/pm_skills.difypkg)
        env:
          CLI_URL: https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.10/dify-plugin-linux-amd64
          CLI_SHA256: 0cef74bcae375a4337c2ff7d42e4787717981a795e1c23cf56bb27ec07ec8304
        run: |
          set -euo pipefail
          node scripts/build-dataset.mjs
          node scripts/build-dify-plugin.mjs
          (cd integrations/dify-plugin && python3 test_core.py)
          curl -fsSL -o "$RUNNER_TEMP/dify" "$CLI_URL"
          echo "${CLI_SHA256}  $RUNNER_TEMP/dify" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/dify"
          mkdir -p web/dify
          "$RUNNER_TEMP/dify" plugin package integrations/dify-plugin -o web/dify/pm_skills.difypkg

      # Chinese names, descriptions and prompts for the share-card maker (web/card.html).
      - name: Build the share-card data (web/card-zh.json)
        run: node scripts/build-share-cards.mjs --check

      # Intranet offline pack. Releases are immutable, so it is served from Pages
      # at /offline/pm-skills-offline.zip with its .sha256 beside it. Pages files
      # must stay under 100 MB; the script fails above 40 MB.
      - name: Build the offline pack (published at /offline/pm-skills-offline.zip)
        run: |
          set -euo pipefail
          node scripts/build-offline-pack.mjs --out web/offline --max-mb 40
          (cd web/offline && sha256sum -c pm-skills-offline.zip.sha256)

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell Baidu and IndexNow (Bing, Yandex and others) about new pages once they are
  # live. Each engine is skipped without its secret; a failed ping only warns.
  ping-search:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Push the sitemap to search engines
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/push-search-engines.mjs
