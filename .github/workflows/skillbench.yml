name: Run SkillBench

# Official model-benchmark runs (skillbench/). Manual only — it costs tokens.
# Results are committed back to skillbench/results.json on main.
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model ids (claude-*/gpt-*/gemini-*)'
        required: true
        default: 'claude-sonnet-4-6'
      judge:
        description: 'Judge model (pinned; disclose changes in the report)'
        required: false
        default: 'claude-sonnet-4-6'
      only:
        description: 'Diagnose: run only these task ids (comma-separated); results are not saved, outputs are uploaded'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run the benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS: ${{ inputs.models }}
          JUDGE: ${{ inputs.judge }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          printf '%s' "$MODELS" | grep -Eq '^[A-Za-z0-9._:,/@-]+$' || { echo "::error::models must be comma-separated ids"; exit 1; }
          printf '%s' "$JUDGE" | grep -Eq '^[A-Za-z0-9._:,-]+$' || { echo "::error::judge must be a model id"; exit 1; }
          if [ -n "$ONLY" ]; then
            printf '%s' "$ONLY" | grep -Eq '^[a-z0-9,-]+$' || { echo "::error::only must be task ids"; exit 1; }
            node skillbench/run-skillbench.mjs --models "$MODELS" --judge "$JUDGE" --only "$ONLY" --save-outputs skillbench-outputs
          else
            node skillbench/run-skillbench.mjs --models "$MODELS" --judge "$JUDGE" --save-outputs skillbench-outputs
          fi
      - name: Upload the outputs (bare and with skill, per task)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skillbench-outputs
          path: skillbench-outputs/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit results
        if: inputs.only == ''
        run: |
          git config user.name "skillbench-bot"
          git config user.email "actions@github.com"
          git checkout -B skillbench-results
          git add skillbench/results.json
          git diff --cached --quiet || git commit -m "bench: SkillBench run — ${{ inputs.models }}"
          git push -f origin skillbench-results
