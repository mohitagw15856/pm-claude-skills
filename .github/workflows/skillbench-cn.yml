name: Run SkillBench (Chinese task set)

# Scores Chinese models on the Chinese task set (skillbench/tasks-zh.json):
# workplace, life admin, exams and content, bare and with the matching skill.
# Manual only. The default models are free: modelscope:* runs on ModelScope
# API-Inference's daily free quota (MODELSCOPE_TOKEN; the ModelScope account must be
# linked to an Alibaba Cloud account once, at no cost). hf:* uses Hugging Face's
# monthly free credits (HF_TOKEN), which cover only a handful of calls. sf:* runs on
# SiliconFlow (SILICONFLOW_API_KEY), where models such as sf:Qwen/Qwen2.5-7B-Instruct
# and sf:THUDM/glm-4-9b-chat are free; larger ones cost a little per call. Paid provider keys still work if set:
# DEEPSEEK_API_KEY, DASHSCOPE_API_KEY (Qwen), MOONSHOT_API_KEY (Kimi),
# ZHIPU_API_KEY (GLM), ARK_API_KEY (Doubao). The judge needs ANTHROPIC_API_KEY.
# Results land on the skillbench-zh-results branch and a pull request to main is
# opened for review (main is PR-only). Also runs on the 1st of each month with the
# models in the SKILLBENCH_ZH_MODELS repository variable, or the defaults below,
# so the Chinese leaderboard card (web/live/modelbench-zh*.svg) stays current.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model ids; modelscope:* and hf:* are free'
        required: true
        default: 'modelscope:deepseek-ai/DeepSeek-V4.1-Flash,modelscope:Qwen/Qwen3.8-27B,modelscope:zai-org/GLM-5.2,modelscope:PaddlePaddle/ERNIE-4.5-300B-A47B-PT'
      judge:
        description: 'Judge model (pinned; disclose changes in the report)'
        required: false
        default: 'claude-sonnet-4-6'

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run the benchmark
        env:
          MODELS: ${{ inputs.models || vars.SKILLBENCH_ZH_MODELS || 'modelscope:deepseek-ai/DeepSeek-V4.1-Flash,modelscope:Qwen/Qwen3.8-27B,modelscope:zai-org/GLM-5.2,modelscope:PaddlePaddle/ERNIE-4.5-300B-A47B-PT' }}
          JUDGE: ${{ inputs.judge || 'claude-sonnet-4-6' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$MODELS" | grep -Eq '^[A-Za-z0-9._:,/-]+$' || { echo "::error::models must be comma-separated ids"; exit 1; }
          printf '%s' "$JUDGE" | grep -Eq '^[A-Za-z0-9._:,-]+$' || { echo "::error::judge must be a model id"; exit 1; }
          node skillbench/run-skillbench.mjs --models "$MODELS" --judge "$JUDGE" \
            --tasks skillbench/tasks-zh.json --out skillbench/results-zh.json
          node scripts/build-modelbench.mjs --results skillbench/results-zh.json \
            --tasks skillbench/tasks-zh.json --out web/modelbench-zh.json
      - name: Commit results and open a pull request
        env:
          MODELS: ${{ inputs.models || vars.SKILLBENCH_ZH_MODELS || 'default models' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "skillbench-bot"
          git config user.email "actions@github.com"
          git checkout -B skillbench-zh-results
          git add skillbench/results-zh.json web/modelbench-zh.json
          git diff --cached --quiet || git commit -m "bench: SkillBench Chinese task set, $MODELS"
          git push -f origin skillbench-zh-results
          if [ "$(gh pr list --head skillbench-zh-results --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head skillbench-zh-results \
              --title "bench: SkillBench Chinese task set results" \
              --body "Automated run of the Chinese task set (skillbench/tasks-zh.json). Models: $MODELS. Review the scores in web/modelbench-zh.json before merging; the live leaderboard card picks them up on the next deploy." \
              || echo "::warning::Could not open the pull request; open one from skillbench-zh-results by hand."
          fi
