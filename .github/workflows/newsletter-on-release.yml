name: Newsletter on release

# When you publish a GitHub Release, this builds a branded HTML announcement
# email from the release notes and makes it effortless to send:
#
#   • FREE plan (no secret needed): the email is uploaded as a downloadable
#     artifact AND printed into the workflow summary — copy it straight into
#     Buttondown → new email → HTML, and hit send. Nothing to configure.
#
#   • PAID plan (optional): add a repo secret BUTTONDOWN_API_KEY and the job
#     also creates a DRAFT in Buttondown with the same HTML. It never
#     auto-sends — you review and send it yourself.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from (e.g. v70.0.0)'
        required: false

permissions:
  contents: read

jobs:
  newsletter:
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the announcement email
        id: build
        env:
          REL_NAME: ${{ github.event.release.name }}
          REL_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REL_BODY: ${{ github.event.release.body }}
          REL_URL: ${{ github.event.release.html_url }}
        run: |
          node scripts/build-newsletter.mjs > /dev/null
          TAG="${REL_TAG:-latest}"
          SAFE="${TAG//[^A-Za-z0-9._-]/_}"
          echo "safe_tag=$SAFE" >> "$GITHUB_OUTPUT"
          echo "html_path=newsletters/$SAFE.html" >> "$GITHUB_OUTPUT"

      - name: Upload email as artifact
        uses: actions/upload-artifact@v4
        with:
          name: email-html
          path: newsletters/${{ steps.build.outputs.safe_tag }}.*

      - name: Draft in Buttondown (paid plan only — optional)
        if: ${{ env.BUTTONDOWN_API_KEY != '' }}
        env:
          REL_NAME: ${{ github.event.release.name }}
          REL_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          SUBJECT="${REL_NAME:-New skills ($REL_TAG)}"
          BODY_HTML=$(cat "${{ steps.build.outputs.html_path }}")
          payload=$(jq -n --arg s "$SUBJECT" --arg b "$BODY_HTML" \
            '{subject: $s, body: $b, status: "draft", email_type: "public"}')
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://api.buttondown.email/v1/emails \
            -H "Authorization: Token $BUTTONDOWN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Buttondown responded $code"
          if [ "$code" = "201" ] || [ "$code" = "200" ]; then
            echo "✓ Draft created in Buttondown — review and send it there."
          else
            echo "::warning::Buttondown draft not created (HTTP $code):"; cat /tmp/resp.json || true
          fi
