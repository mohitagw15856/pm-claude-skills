name: Weekly data refresh

# One Monday run and one pull request for the three weekly data refreshes that used to
# be three workflows and three pull requests (each pull request also started its own
# set of checks):
#   - web/feedback.json and web/ab-status.json: opt-in ratings from GoatCounter
#   - web/trending.json and web/china-usage.json: most-run skills and the mainland counters
#   - web/skill-of-the-week.json: the featured skill, with X and LinkedIn posts in the summary
#
# ONE-TIME SETUP:
#   1. GoatCounter, Settings, "API tokens": create a token with "Read statistics" and add
#      it as the repo secret GOATCOUNTER_TOKEN. Without it the scripts do nothing.
#   2. Optional: POST_WEBHOOK_URL (a Zapier, Make, Buffer or Slack webhook taking
#      { text, linkedin, skill, link }) publishes the skill of the week post.

on:
  schedule:
    - cron: '26 7 * * 1'   # Mondays 07:26 UTC
  workflow_dispatch:

concurrency:
  group: weekly-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Each refresh is independent: one failing source must not block the others.
      - name: Build feedback.json
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: mohitagw
        run: |
          node scripts/build-feedback.mjs
          node scripts/ab-decide.mjs
      - name: Build trending.json
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: mohitagw
        run: node scripts/build-trending.mjs
      # The counters visible from mainland China (npmmirror, Gitee, ModelScope). Public
      # endpoints; a failed source keeps its last values, so this step never fails the job.
      - name: Build china-usage.json
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/build-china-usage.mjs || true
      - name: Pick and compose the skill of the week
        continue-on-error: true
        env:
          POST_WEBHOOK_URL: ${{ secrets.POST_WEBHOOK_URL }}
        run: node scripts/skill-of-the-week.mjs

      # main is protected (requires pull requests), so open one instead of pushing.
      # create-pull-request does nothing when none of the files changed.
      - name: Open one PR with the refreshed data
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            web/feedback.json
            web/ab-status.json
            web/trending.json
            web/china-usage.json
            web/skill-of-the-week.json
          branch: weekly-data
          delete-branch: true
          commit-message: "chore(data): weekly refresh of ratings, trending and skill of the week"
          title: "chore(data): weekly refresh"
          body: |
            Auto-generated by the **Weekly data refresh** workflow. Merging updates the
            rating badges, the trending strip and the featured skill on the playground.
            The composed X and LinkedIn posts are in the workflow run's job summary.

      # Data-only PR: merge it straight away if it touches nothing but the expected files.
      # Anything else is left open for a person to review.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^web/(feedback|ab-status|trending|china-usage|skill-of-the-week)\.json$'; then
            echo "::warning::PR #$PR changes files outside the five weekly data files; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
