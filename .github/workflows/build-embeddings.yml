name: Build search embeddings

# Smart search (web/semantic.js) compares a visitor's question with one vector
# per skill. When skill titles or descriptions change, this rebuilds the vectors
# (scripts/build-embeddings.mjs, two small open models, no API key) and lands them
# through a self-merging data-only pull request.
on:
  push:
    branches: [main]
    paths:
      - 'skills/*/SKILL.md'
      - 'scripts/build-embeddings.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-embeddings
  cancel-in-progress: true

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: embed-models-v1
      - name: Build the vectors
        run: |
          npm i --no-save @huggingface/transformers@4.3.1
          node web/build-skills.mjs
          node scripts/build-embeddings.mjs
      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: web/embeddings/*
          branch: build-embeddings
          delete-branch: true
          commit-message: "data: refresh search embeddings"
          title: "data: refresh search embeddings"
          body: Auto-generated by the **Build search embeddings** workflow.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^web/embeddings/(en\.bin|multi\.bin|index\.json)$'; then
            echo "::warning::PR #$PR changes unexpected files; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
