name: Refresh feedback ratings

# Aggregates the playground's opt-in 👍/👎 ratings from GoatCounter into web/feedback.json so
# skills can show a real "👍 92% · 24 ratings" proof badge. The API token stays in repo secrets
# (never in the client). No token configured → the script no-ops, so this is harmless. Uses the
# same GOATCOUNTER_TOKEN secret as the trending workflow.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC (alongside trending)
  workflow_dispatch:

concurrency:
  group: feedback
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build feedback.json
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: mohitagw
        run: |
          node scripts/build-feedback.mjs
          node scripts/ab-decide.mjs
      - name: Open a PR with the refreshed feedback data
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            web/feedback.json
            web/ab-status.json
          branch: feedback-data
          delete-branch: true
          commit-message: "chore(feedback): refresh 👍/👎 ratings from usage"
          title: "chore(feedback): refresh skill ratings"
          body: |
            Auto-generated by the **Refresh feedback ratings** workflow from GoatCounter usage.
            Merging this updates the "👍 helpful%" proof badges on the playground.

      # Data-only PR: merge it straight away if it touches nothing but the expected files.
      # Anything else is left open for a person to review.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^web/(feedback|ab-status)\.json$'; then
            echo "::warning::PR #$PR changes files outside ^web/feedback\.json$; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
