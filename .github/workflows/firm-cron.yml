name: Firm session

# The live Firm: an AI executive staff that runs THIS repository in public. Each
# week it scores its due predictions against the real numbers (free), then meets
# on the repo's live data (stars, npm downloads, quality numbers, recent pull
# requests, open issues) and files a memo with one machine-checkable prediction
# (scripts/firm-session.mjs --live). Everything lands in firm-sessions/ and
# data/firm-ledger.json, shown at web/firm-live.html, through a data-only pull
# request that merges itself.
#
# Meeting costs one API call. The weekly schedule runs only once the owner opts
# in with the repository variable FIRM_LIVE=true; manual dispatch always works.
# Prediction scoring runs on schedule either way, since it costs nothing.
on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      agenda:
        description: What should the firm convene on?
        default: 'Pick the single sharpest open question facing this repository and resolve it.'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: firm-session
  cancel-in-progress: false

jobs:
  convene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Score predictions that are due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/score-firm-predictions.mjs

      - name: Convene the firm on the repo's live numbers
        if: github.event_name == 'workflow_dispatch' || vars.FIRM_LIVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRM_AGENDA: ${{ github.event.inputs.agenda || 'Pick the single sharpest open question facing this repository and resolve it.' }}
        run: node scripts/firm-session.mjs --live --out firm-sessions

      - name: Open the pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            firm-sessions/*.md
            data/firm-ledger.json
          branch: firm-session
          delete-branch: true
          commit-message: "firm: weekly session and prediction scores"
          title: "firm: weekly session and prediction scores"
          body: |
            Auto-generated by the **Firm session** workflow: the live Firm's memo
            for this week and any predictions that came due.

      # Data-only PR: merge it straight away if it touches nothing but the expected files.
      - name: Merge the data-only PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(firm-sessions/[0-9]{4}-[0-9]{2}-[0-9]{2}-firm-session\.md|data/firm-ledger\.json)$'; then
            echo "::warning::PR #$PR changes unexpected files; leaving it for review."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
