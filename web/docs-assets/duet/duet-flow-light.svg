<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
<title>How PM Skills works inside Claude Duet: your connected apps are checked every few hours, a Duet-ready skill turns what it finds into a short cited brief and drafts, and anything outward waits at an approval gate for your yes.</title>
<style>.d{animation:mv 4.8s linear infinite}.d2{animation-delay:-1.6s}.d3{animation-delay:-3.2s}@keyframes mv{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(720px);opacity:0}}.gate{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.d,.gate{animation:none}}</style>
<rect width="920" height="430" rx="16" fill="#ffffff"/>
<text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">How PM Skills works inside Claude Duet</text>
<text x="460" y="64" text-anchor="middle" font-size="13" fill="#656d76">Duet uses the skills in your Claude account. Duet-ready skills keep an always-on agent short, cited and careful.</text>
<line x1="100" y1="296" x2="820" y2="296" stroke="#d0d7de" stroke-width="3" stroke-dasharray="6 7"/>
<text x="190" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<text x="370" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<text x="550" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<text x="730" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#656d76">›</text>
<circle class="d" cx="100" cy="296" r="6" fill="#8250df"/>
<circle class="d d2" cx="100" cy="296" r="6" fill="#8250df"/>
<circle class="d d3" cx="100" cy="296" r="6" fill="#8250df"/>
<g><rect x="20" y="110" width="160" height="160" rx="14" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><rect x="20" y="110" width="160" height="6" rx="3" fill="#0969da"/><text x="100" y="160" text-anchor="middle" font-size="30">📥</text><text x="100" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Your apps</text><text x="100" y="222" text-anchor="middle" font-size="11.5" fill="#656d76">Gmail · Slack · Stripe</text><text x="100" y="240" text-anchor="middle" font-size="11.5" fill="#656d76">Xero · Shopify · HubSpot</text></g>
<g><rect x="200" y="110" width="160" height="160" rx="14" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><rect x="200" y="110" width="160" height="6" rx="3" fill="#8250df"/><text x="280" y="160" text-anchor="middle" font-size="30">🌅</text><text x="280" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Claude Duet</text><text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#656d76">checks every few hours</text><text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#656d76">while you're away</text></g>
<g><rect x="380" y="110" width="160" height="160" rx="14" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><rect x="380" y="110" width="160" height="6" rx="3" fill="#1a7f37"/><text x="460" y="160" text-anchor="middle" font-size="30">⚡</text><text x="460" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Duet-ready skill</text><text x="460" y="222" text-anchor="middle" font-size="11.5" fill="#656d76">cites every source</text><text x="460" y="240" text-anchor="middle" font-size="11.5" fill="#656d76">drafts, never says "done"</text></g>
<g><rect x="560" y="110" width="160" height="160" rx="14" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><rect class="gate" x="560" y="110" width="160" height="6" rx="3" fill="#9a6700"/><text x="640" y="160" text-anchor="middle" font-size="30">🛡</text><text x="640" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Approval gate</text><text x="640" y="222" text-anchor="middle" font-size="11.5" fill="#656d76">send · pay · sign · delete</text><text x="640" y="240" text-anchor="middle" font-size="11.5" fill="#656d76">wait for your yes</text></g>
<g><rect x="740" y="110" width="160" height="160" rx="14" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><rect x="740" y="110" width="160" height="6" rx="3" fill="#0969da"/><text x="820" y="160" text-anchor="middle" font-size="30">🙋</text><text x="820" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">You</text><text x="820" y="222" text-anchor="middle" font-size="11.5" fill="#656d76">a short morning brief</text><text x="820" y="240" text-anchor="middle" font-size="11.5" fill="#656d76">alerts only when needed</text></g>
<text x="460" y="284" text-anchor="middle" font-size="11.5" fill="#656d76">findings flow left to right; anything outward stops at the gate until you say yes</text>
<rect x="20" y="318" width="880" height="92" rx="12" fill="#eef1f5"/>
<text x="60" y="352" font-size="13.5" font-weight="600" fill="#1a7f37">✓ reads first; acts only on your yes</text>
<text x="500" y="352" font-size="13.5" font-weight="600" fill="#1a7f37">✓ every claim names its source</text>
<text x="60" y="386" font-size="13.5" font-weight="600" fill="#1a7f37">✓ says drafted, approved or shipped, never "done"</text>
<text x="500" y="386" font-size="13.5" font-weight="600" fill="#cf222e">✗ never sends, pays, signs or deletes alone</text>
</svg>
