<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
<title>How PM Skills works inside Claude Duet: your connected apps are checked every few hours, a Duet-ready skill turns what it finds into a short cited brief and drafts, and anything outward waits at an approval gate for your yes.</title>
<style>.d{animation:mv 4.8s linear infinite}.d2{animation-delay:-1.6s}.d3{animation-delay:-3.2s}@keyframes mv{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(720px);opacity:0}}.gate{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.d,.gate{animation:none}}</style>
<rect width="920" height="430" rx="16" fill="#0d1117"/>
<text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">How PM Skills works inside Claude Duet</text>
<text x="460" y="64" text-anchor="middle" font-size="13" fill="#8b949e">Duet uses the skills in your Claude account. Duet-ready skills keep an always-on agent short, cited and careful.</text>
<line x1="100" y1="296" x2="820" y2="296" stroke="#30363d" stroke-width="3" stroke-dasharray="6 7"/>
<text x="190" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#8b949e">›</text>
<text x="370" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#8b949e">›</text>
<text x="550" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#8b949e">›</text>
<text x="730" y="196" text-anchor="middle" font-size="22" font-weight="700" fill="#8b949e">›</text>
<circle class="d" cx="100" cy="296" r="6" fill="#d2a8ff"/>
<circle class="d d2" cx="100" cy="296" r="6" fill="#d2a8ff"/>
<circle class="d d3" cx="100" cy="296" r="6" fill="#d2a8ff"/>
<g><rect x="20" y="110" width="160" height="160" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><rect x="20" y="110" width="160" height="6" rx="3" fill="#58a6ff"/><text x="100" y="160" text-anchor="middle" font-size="30">📥</text><text x="100" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Your apps</text><text x="100" y="222" text-anchor="middle" font-size="11.5" fill="#8b949e">Gmail · Slack · Stripe</text><text x="100" y="240" text-anchor="middle" font-size="11.5" fill="#8b949e">Xero · Shopify · HubSpot</text></g>
<g><rect x="200" y="110" width="160" height="160" rx="14" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/><rect x="200" y="110" width="160" height="6" rx="3" fill="#d2a8ff"/><text x="280" y="160" text-anchor="middle" font-size="30">🌅</text><text x="280" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Claude Duet</text><text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#8b949e">checks every few hours</text><text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#8b949e">while you're away</text></g>
<g><rect x="380" y="110" width="160" height="160" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><rect x="380" y="110" width="160" height="6" rx="3" fill="#3fb950"/><text x="460" y="160" text-anchor="middle" font-size="30">⚡</text><text x="460" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Duet-ready skill</text><text x="460" y="222" text-anchor="middle" font-size="11.5" fill="#8b949e">cites every source</text><text x="460" y="240" text-anchor="middle" font-size="11.5" fill="#8b949e">drafts, never says "done"</text></g>
<g><rect x="560" y="110" width="160" height="160" rx="14" fill="#161b22" stroke="#d29922" stroke-width="2"/><rect class="gate" x="560" y="110" width="160" height="6" rx="3" fill="#d29922"/><text x="640" y="160" text-anchor="middle" font-size="30">🛡</text><text x="640" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Approval gate</text><text x="640" y="222" text-anchor="middle" font-size="11.5" fill="#8b949e">send · pay · sign · delete</text><text x="640" y="240" text-anchor="middle" font-size="11.5" fill="#8b949e">wait for your yes</text></g>
<g><rect x="740" y="110" width="160" height="160" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><rect x="740" y="110" width="160" height="6" rx="3" fill="#58a6ff"/><text x="820" y="160" text-anchor="middle" font-size="30">🙋</text><text x="820" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">You</text><text x="820" y="222" text-anchor="middle" font-size="11.5" fill="#8b949e">a short morning brief</text><text x="820" y="240" text-anchor="middle" font-size="11.5" fill="#8b949e">alerts only when needed</text></g>
<text x="460" y="284" text-anchor="middle" font-size="11.5" fill="#8b949e">findings flow left to right; anything outward stops at the gate until you say yes</text>
<rect x="20" y="318" width="880" height="92" rx="12" fill="#1c2330"/>
<text x="60" y="352" font-size="13.5" font-weight="600" fill="#3fb950">✓ reads first; acts only on your yes</text>
<text x="500" y="352" font-size="13.5" font-weight="600" fill="#3fb950">✓ every claim names its source</text>
<text x="60" y="386" font-size="13.5" font-weight="600" fill="#3fb950">✓ says drafted, approved or shipped, never "done"</text>
<text x="500" y="386" font-size="13.5" font-weight="600" fill="#f85149">✗ never sends, pays, signs or deletes alone</text>
</svg>
