<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PM Skills — 1028 professional agent skills your AI can read">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset=".55" stop-color="#2a1a5e"/>
      <stop offset="1" stop-color="#0f2e4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5cf5"/>
      <stop offset="1" stop-color="#4ecdc4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { animation: float 5s ease-in-out infinite; }
      .c2 { animation-delay: -1.2s; } .c3 { animation-delay: -2.4s; }
      .c4 { animation-delay: -3.1s; } .c5 { animation-delay: -4s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      .tw { animation: tw 2.6s ease-in-out infinite; } .tw2 { animation-delay: -1.3s; }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:.95 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#cbb8ff">
    <path class="tw"  d="M96 60 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
    <path class="tw2" d="M1108 236 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
    <circle class="tw"  cx="1052" cy="66" r="3.5"/>
    <circle class="tw2" cx="180" cy="248" r="3"/>
    <circle class="tw"  cx="620" cy="34" r="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="92" y="140" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">PM Skills</text>
  <rect x="95" y="158" width="210" height="6" rx="3" fill="url(#accent)"/>
  <text x="92" y="200" font-size="26" fill="#e7e0ff">1028 professional skills your AI assistant can read.</text>
  <text x="92" y="234" font-size="19" fill="#a99fd6">Plain markdown · Claude · ChatGPT · Gemini · Cursor · Codex · MIT</text>
  <text x="92" y="278" font-size="17" fill="#7fe3db">npx pm-claude-skills add</text>
  <rect x="80" y="258" width="270" height="30" rx="8" fill="none" stroke="#4ecdc4" stroke-opacity=".5"/>

  <!-- floating skill cards -->
  <g filter="url(#soft)">
    <g class="card">
      <rect x="700" y="52" width="200" height="64" rx="12" fill="#ffffff"/>
      <text x="722" y="92" font-size="26">🔍</text>
      <text x="758" y="80" font-size="16" font-weight="700" fill="#1b1035">lease-decoder</text>
      <text x="758" y="100" font-size="12" fill="#5a5478">read it before you sign</text>
    </g>
    <g class="card c2">
      <rect x="930" y="92" width="200" height="64" rx="12" fill="#ffffff"/>
      <text x="1028" y="132" font-size="26">📋</text>
      <text x="988" y="120" font-size="16" font-weight="700" fill="#1b1035">prd-template</text>
      <text x="988" y="140" font-size="12" fill="#5a5478">specs teams can ship</text>
    </g>
    <g class="card c3">
      <rect x="742" y="146" width="200" height="64" rx="12" fill="#ffffff"/>
      <text x="764" y="186" font-size="26">🎭</text>
      <text x="800" y="174" font-size="16" font-weight="700" fill="#1b1035">salary-negotiation</text>
      <text x="800" y="194" font-size="12" fill="#5a5478">face the hard room early</text>
    </g>
    <g class="card c4">
      <rect x="962" y="196" width="188" height="64" rx="12" fill="#ffffff"/>
      <text x="984" y="236" font-size="26">🧮</text>
      <text x="1020" y="224" font-size="16" font-weight="700" fill="#1b1035">rent-vs-buy</text>
      <text x="1020" y="244" font-size="12" fill="#5a5478">honest math, no vibes</text>
    </g>
    <g class="card c5">
      <rect x="706" y="240" width="228" height="64" rx="12" fill="#ffffff"/>
      <text x="726" y="280" font-size="26">🚨</text>
      <text x="762" y="268" font-size="15" font-weight="700" fill="#1b1035">incident-postmortem</text>
      <text x="762" y="288" font-size="12" fill="#5a5478">blameless, root-caused</text>
    </g>
  </g>
</svg>
